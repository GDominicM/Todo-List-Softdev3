version: "3.9"

services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todolist
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Backend API (Express + Prisma)
  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    depends_on:
      - db
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/todolist?schema=public"
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  # Frontend (React)
  frontend:             # ← needs to be indented here
    build: ./frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:4000

volumes:
  postgres_data:
